name: Update tax data

# SSA publishes next year's Social Security wage base in October; IRS Pub 15-T
# and CA EDD DE 44 follow in November-December. Check weekly through January
# and open a pull request once any of them adds new data. The update tools exit
# cleanly when a source isn't published yet, and skip years already present.
on:
  schedule:
    - cron: "0 15 * 10,11,12,1 1"
  workflow_dispatch:
    inputs:
      year:
        description: "Tax year to add (default: next year, or this year in January)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Pick tax year
        id: year
        env:
          INPUT_YEAR: ${{ inputs.year }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            year="$INPUT_YEAR"
          elif [ "$(date -u +%m)" = "01" ]; then
            year="$(date -u +%Y)"
          else
            year="$(( $(date -u +%Y) + 1 ))"
          fi
          echo "year=$year" >> "$GITHUB_OUTPUT"
      - name: Social Security wage base (SSA COLA notice)
        run: >
          uv run --group tools python tools/federal/update_federal_tax_year.py
          --ss-only --year ${{ steps.year.outputs.year }}
      # The IRS serves whichever Pub 15-T is current, so let the tool detect its year
      - name: Federal withholding tables (IRS Pub 15-T)
        run: uv run --group tools python tools/federal/update_federal_tax_year.py
      - name: California withholding tables (EDD DE 44)
        run: >
          uv run --group tools python tools/state/ca/update_ca_tax_year.py
          --year ${{ steps.year.outputs.year }}
      - name: Run tests
        run: uv run --group test --group tools python -m pytest tests
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/**
          branch: update-tax-data-${{ steps.year.outputs.year }}
          commit-message: Add ${{ steps.year.outputs.year }} tax data
          title: Add ${{ steps.year.outputs.year }} tax data
          body: |
            Generated by the `Update tax data` workflow from the SSA's Federal
            Register COLA notice, IRS Pub 15-T, and CA EDD DE 44. Tests passed
            before this PR was opened.
